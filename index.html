<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>家电维修视频站</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <h1>家电维修视频站</h1>
      <p>按品类、品牌、型号、故障部位查找维修视频</p>
    </div>
  </header>

  <main class="layout">
    <!-- 新增：品类选择侧边栏 -->
    <aside class="sidebar category-sidebar">
      <section class="panel">
        <h2>品类</h2>
        <button class="category-btn active" data-category="phone">手机 / 平板</button>
        <button class="category-btn" data-category="tv">电视 / 显示器</button>
        <button class="category-btn" data-category="ac">空调</button>
        <button class="category-btn" data-category="refrigerator">冰箱</button>
        <button class="category-btn" data-category="washer">洗衣机</button>
        <button class="category-btn" data-category="laptop">笔记本电脑</button>
      </section>
    </aside>

    <!-- 原有侧边栏，现在作为“品牌与型号”区域 -->
    <aside class="sidebar brand-sidebar">
      <section class="panel">
        <h2 id="brandPanelTitle">品牌</h2>
        <div id="brandList" class="brand-list">
          <!-- 品牌按钮将由JS动态生成 -->
        </div>
      </section>

      <section class="panel">
        <h2 id="modelPanelTitle">型号</h2>
        <div id="modelList" class="model-list"></div>
      </section>
    </aside>

    <section class="content">
      <section class="panel">
        <p class="breadcrumb">
          <span id="currentCategory">手机</span> > <span id="currentBrand">Apple</span> > <span id="currentModel">iPhone 15</span> > <span id="currentPart">屏幕</span>
        </p>
        <h2 id="pageTitle">iPhone 15 维修视频</h2>
        <input
          id="searchInput"
          class="search"
          type="text"
          placeholder="搜索型号、故障、视频标题"
        />
      </section>

      <section class="panel">
        <h2>故障部位</h2>
        <div id="partList" class="part-grid"></div>
      </section>

      <section class="repair-result-layout">
        <section class="panel videos-panel">
          <h2>对应维修视频</h2>
          <div id="videoList" class="video-grid"></div>
        </section>

        <section class="panel products-panel">
          <div class="panel-title-row">
            <h2>对应配件商品</h2>
            <span class="product-hint">商品页占位，暂不跳转购买</span>
          </div>
          <div id="productList" class="product-grid"></div>
        </section>
      </section>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
